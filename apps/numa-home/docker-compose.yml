services:
  numa-home:
    image: ghcr.io/simmmmm/numa-home:0.47.0
    volumes:
      - ${ROOT_FOLDER_HOST}/media/data/images:/photos
      - ${APP_DATA_DIR}/data/sent:/sent
      - ${APP_DATA_DIR}/data/home:/data
    environment:
      - TZ=${TZ}
      - NUMA_HOME_PROXY=172.18.0.0/16
    x-runtipi:
      internal_port: 8283
      is_main: true
x-runtipi:
  schema_version: 2
